name: Build & Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装打包与应用依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller watchdog

      - name: 使用 PyInstaller 打包 macOS .app 应用
        run: |
          pyinstaller packaging/macos/spaceradar.spec --clean --noconfirm

      - name: 生成现代化拖拽安装 DMG 镜像
        run: |
          ARCH=$(uname -m)
          DMG_NAME="SpaceRadar-v1.0.0-macOS-${ARCH}.dmg"
          rm -rf dist/dmg
          mkdir -p dist/dmg
          cp -R dist/SpaceRadar.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "SpaceRadar" -srcfolder dist/dmg -ov -format UDZO "dist/${DMG_NAME}"
          rm -rf dist/dmg

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SpaceRadar-macOS-DMG
          path: dist/SpaceRadar-*.dmg

      - name: 自动发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpaceRadar-*.dmg
          generate_release_notes: true
