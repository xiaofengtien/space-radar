name: Build & Release Windows NSIS Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装打包与应用依赖
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: 使用 PyInstaller 打包 Windows 独立应用目录
        run: |
          pyinstaller packaging/windows/spaceradar.spec

      - name: 使用 NSIS 编译生成现代化安装程序
        shell: cmd
        run: |
          if exist "C:\Program Files (x86)\NSIS\makensis.exe" (
            "C:\Program Files (x86)\NSIS\makensis.exe" -INPUTCHARSET UTF8 packaging/windows/installer.nsi
          ) else if exist "C:\Program Files\NSIS\makensis.exe" (
            "C:\Program Files\NSIS\makensis.exe" -INPUTCHARSET UTF8 packaging/windows/installer.nsi
          ) else (
            choco install nsis -y
            "C:\Program Files (x86)\NSIS\makensis.exe" -INPUTCHARSET UTF8 packaging/windows/installer.nsi
          )

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SpaceRadar-Windows-x64-Setup
          path: dist/SpaceRadar-Setup-*.exe

      - name: 自动发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpaceRadar-Setup-*.exe
          generate_release_notes: true
